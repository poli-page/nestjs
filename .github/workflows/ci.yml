name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Allow codecov-action's tokenless (OIDC) upload on public repo.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 20, nest: 10 }
          - { node: 20, nest: 11 }
          - { node: 22, nest: 10 }
          - { node: 22, nest: 11 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Pin Nest major
        run: npm install --no-save @nestjs/common@^${{ matrix.nest }} @nestjs/core@^${{ matrix.nest }} @nestjs/testing@^${{ matrix.nest }} @nestjs/platform-express@^${{ matrix.nest }} @nestjs/platform-fastify@^${{ matrix.nest }}
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: API contract
        id: contract
        uses: poli-page/api-contract@1f705b3ce3e15ff56e2f7b8249c1a2983af2312c # v0.13.0
      - name: Test (with coverage)
        run: npm run test:coverage
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
      - name: Upload coverage to Codecov
        if: matrix.node == 22 && matrix.nest == 11
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          # OIDC auth — no CODECOV_TOKEN secret needed; requires id-token: write
          # (set on the test job) and the repo to be enrolled at codecov.io.
          use_oidc: true
          fail_ci_if_error: false
      - name: Build
        run: npm run build
      - name: Validate published types & manifest (attw + publint)
        run: npm run lint:pack

  example-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            example-app/package-lock.json
      - run: npm ci
      - name: Build the library
        run: npm run build
      - name: Install the example app
        run: npm ci
        working-directory: example-app
      - name: Build the example app
        run: npm run build
        working-directory: example-app
