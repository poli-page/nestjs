name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 18, nest: 10 }
          - { node: 18, nest: 11 }
          - { node: 20, nest: 10 }
          - { node: 20, nest: 11 }
          - { node: 22, nest: 10 }
          - { node: 22, nest: 11 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Pin Nest major
        run: npm install --no-save @nestjs/common@^${{ matrix.nest }} @nestjs/core@^${{ matrix.nest }} @nestjs/testing@^${{ matrix.nest }} @nestjs/platform-express@^${{ matrix.nest }}
      - name: Typecheck
        run: npm run typecheck
        if: hashFiles('tsconfig.json') != ''
      - name: Lint
        run: npm run lint
        if: hashFiles('eslint.config.mjs') != ''
      - name: Test
        run: npm test
        if: hashFiles('jest.config.ts') != ''
      - name: Build
        run: npm run build
        if: hashFiles('nest-cli.json') != ''
